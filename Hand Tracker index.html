<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Tracker</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0f1a; color: #e8ecf5; font-family: system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; }
  h1 { font-size: 1.3rem; margin: 4px 0 12px; }
  #stage { position: relative; width: 100%; max-width: 900px; aspect-ratio: 4/3; background: #000;
           border-radius: 14px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  #status { position: absolute; left: 12px; top: 12px; background: rgba(0,0,0,.55); padding: 6px 12px;
            border-radius: 20px; font-size: .85rem; z-index: 5; }
  #info { margin-top: 14px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .card { background: #151b2c; padding: 10px 18px; border-radius: 10px; min-width: 150px; text-align: center; }
  .card b { display: block; font-size: 1.6rem; margin-top: 2px; }
  button { background: #4f7cff; color: #fff; border: 0; padding: 10px 20px; border-radius: 10px;
           font-size: 1rem; cursor: pointer; margin-top: 14px; }
  button:hover { background: #3b66e6; }
  p.hint { opacity: .6; font-size: .85rem; max-width: 600px; text-align: center; }
</style>
</head>
<body>
  <h1>Hand Tracker</h1>
  <div id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="status">Click “Start Camera”</div>
  </div>
  <div id="info">
    <div class="card">Hands detected<b id="hands">0</b></div>
    <div class="card">Fingers up<b id="fingers">0</b></div>
    <div class="card">FPS<b id="fps">0</b></div>
  </div>
  <button id="startBtn">Start Camera</button>
  <p class="hint">Show your hand to the camera. Each finger has its own colour; the dots are the 21 landmarks.</p>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

// Landmark groups, each with its own colour
const FINGERS = [
  { name: 'thumb',  color: '#ff4d6d', pts: [0,1,2,3,4] },
  { name: 'index',  color: '#ffb703', pts: [0,5,6,7,8] },
  { name: 'middle', color: '#06d6a0', pts: [0,9,10,11,12] },
  { name: 'ring',   color: '#4cc9f0', pts: [0,13,14,15,16] },
  { name: 'pinky',  color: '#b388ff', pts: [0,17,18,19,20] },
];
const PALM = [5, 9, 13, 17];

const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`
});
hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});
hands.onResults(onResults);

function countFingers(lm, label) {
  let n = 0;
  // 4 fingers: tip above PIP joint (y smaller = higher on screen)
  [[8,6],[12,10],[16,14],[20,18]].forEach(([tip, pip]) => { if (lm[tip].y < lm[pip].y) n++; });
  // Thumb: compare x distance relative to hand side
  const right = label === 'Right'; // MediaPipe label is from the mirrored image
  if (right ? lm[4].x < lm[3].x : lm[4].x > lm[3].x) n++;
  return n;
}

let last = performance.now(), frames = 0;

function onResults(res) {
  const w = canvas.width = video.videoWidth || 640;
  const h = canvas.height = video.videoHeight || 480;
  ctx.clearRect(0, 0, w, h);

  // FPS
  frames++;
  const now = performance.now();
  if (now - last >= 1000) { document.getElementById('fps').textContent = frames; frames = 0; last = now; }

  const list = res.multiHandLandmarks || [];
  document.getElementById('hands').textContent = list.length;
  let totalUp = 0;

  list.forEach((lm, i) => {
    const label = res.multiHandedness[i].label;
    totalUp += countFingers(lm, label);
    const P = p => [p.x * w, p.y * h];

    // Palm outline
    ctx.beginPath();
    [0, ...PALM].forEach((idx, k) => { const [x, y] = P(lm[idx]); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2; ctx.fill(); ctx.stroke();

    // Coloured finger lines
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    FINGERS.forEach(f => {
      ctx.beginPath();
      f.pts.forEach((idx, k) => { const [x, y] = P(lm[idx]); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.strokeStyle = f.color; ctx.lineWidth = 5;
      ctx.shadowColor = f.color; ctx.shadowBlur = 12;
      ctx.stroke();
    });
    ctx.shadowBlur = 0;

    // Landmark dots
    lm.forEach((p, idx) => {
      const [x, y] = P(p);
      const isTip = [4,8,12,16,20].includes(idx);
      ctx.beginPath();
      ctx.arc(x, y, isTip ? 8 : 5, 0, Math.PI * 2);
      ctx.fillStyle = isTip ? '#ffffff' : '#0b0f1a';
      ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
    });
  });

  document.getElementById('fingers').textContent = totalUp;
  statusEl.textContent = list.length ? 'Tracking ✔' : 'Show your hand…';
}

async function start() {
  document.getElementById('startBtn').disabled = true;
  statusEl.textContent = 'Starting camera…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 1280, height: 720, facingMode: 'user' }, audio: false
    });
    video.srcObject = stream;
    await video.play();
    statusEl.textContent = 'Loading model…';
    const loop = async () => {
      if (video.readyState >= 2) await hands.send({ image: video });
      requestAnimationFrame(loop);
    };
    loop();
  } catch (e) {
    statusEl.textContent = 'Camera error: ' + e.message;
    document.getElementById('startBtn').disabled = false;
  }
}
document.getElementById('startBtn').addEventListener('click', start);
</script>
</body>
</html>
